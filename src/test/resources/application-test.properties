# ─────────────────────────────────────────────────────────────────────────────
# TEST-ONLY configuration (profile: test).
#
# Loaded ADDITIVELY on top of the main application.properties for @SpringBootTest
# classes annotated with @ActiveProfiles("test"). Its sole purpose is to supply the
# secrets that BUG-15 intentionally removed from the tracked production config, so the
# full application context can load during tests. These are throwaway test values, NOT
# real secrets, and this file is never used at runtime (it lives under src/test).
#
# NOTE: @SpringBootTest still requires a running PostgreSQL (jdbc:.../diploma_system).
# ─────────────────────────────────────────────────────────────────────────────

# Local signing key for tokens minted during tests (login/register round-trips).
jwt.secret=test-only-local-jwt-signing-key-0123456789-abcdefghij

# External auth stays disabled for tests; its key is intentionally blank.
auth.external-enabled=false
auth.external-jwt-secret=

# Local PostgreSQL password (matches the documented local dev instance).
spring.datasource.password=123
