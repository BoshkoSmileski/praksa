spring.application.name=praksa

# ─── Local secret overrides (NOT committed) ───────────────────────────────────
# Optional file, loaded if present. Put real SMTP credentials / production secrets
# here instead of in this tracked file. It is git-ignored. See
# application-local.properties.example for the template. Environment variables
# still take precedence over both files.
spring.config.import=optional:file:./application-local.properties

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
# The password is a REQUIRED secret with NO inline default (BUG-15). Production
# must supply SPRING_DATASOURCE_PASSWORD; local dev supplies spring.datasource.password
# via the git-ignored application-local.properties (see the .example template). If the
# value is absent the placeholder cannot resolve and startup fails fast — the app never
# starts with a known/default DB password. URL and username are non-secret and keep
# their local-dev defaults.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/diploma_system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Suppress "PostgreSQLDialect does not need to be specified" warning
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Suppress "open-in-view is enabled" warning — we don't use it (we use DTOs)
spring.jpa.open-in-view=false

# ─── File storage ─────────────────────────────────────────────────────────────
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ─── JWT ──────────────────────────────────────────────────────────────────────
# LOCAL application signing key — used to sign & verify the JWTs WE mint via
# /api/auth/login and /api/auth/register. REQUIRED secret with NO inline default
# (BUG-15): production must supply JWT_SECRET; local dev supplies jwt.secret via the
# git-ignored application-local.properties (see the .example template). If missing,
# JwtUtil fails fast at startup — the app never runs with a known/default signing key.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── External auth integration ────────────────────────────────────────────────
# auth.external-enabled=false (default): we issue AND verify our own JWTs with
#   jwt.secret above (normal local authentication).
# auth.external-enabled=true: tokens come from an external auth provider and are
#   verified with a SEPARATE, explicitly-configured signing key — auth.external-jwt-secret
#   (EXTERNAL_JWT_SECRET) — NOT jwt.secret. Unknown but authenticated users are
#   auto-provisioned from the token's claims (email, name, role, optional index_number).
#
# auth.external-jwt-secret has NO inline default and NO fallback to jwt.secret: if
# external auth is enabled without it, JwtUtil fails fast at startup rather than
# silently reusing the local/development key (BUG-15). It stays empty (unused) in the
# default local mode, which is intentional and not a security-sensitive requirement.
auth.external-enabled=${AUTH_EXTERNAL_ENABLED:false}
auth.external-jwt-secret=${EXTERNAL_JWT_SECRET:}

# ─── Mail / SMTP ──────────────────────────────────────────────────────────────
# All values are env-overridable and provider-agnostic (Gmail, Mailtrap, a
# university relay, or any other SMTP server — the provider is configuration,
# not code). NO real credentials live in this tracked file: username/password
# default to empty. Supply them via environment variables or the git-ignored
# application-local.properties (see the .example template).
#
# app.mail.enabled gates delivery:
#   false (default) → email delivery is cleanly DISABLED. Notification rows are
#                     still created and remain is_sent=false (honest — the app
#                     never pretends an email was sent). No SMTP connection is
#                     attempted, so local dev needs no mail server.
#   true            → emails are actually sent via the SMTP settings below.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${spring.mail.username:no-reply@diploma-system.local}}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# ─── Notification retry (P2.6) ────────────────────────────────────────────────
# Background job (ScheduledTasksService.retryUnsentNotifications) that re-attempts
# delivery of notifications still is_sent=false (send failed, or mail was disabled
# when the row was created). It re-uses EmailService — it never creates a new row
# and never marks one sent itself. All values are env-overridable.
#   interval-ms       how often the job runs (fixedDelay). Default 15 min — deliberately
#                     unaggressive, matching the other scheduled jobs' cadence.
#   initial-delay-ms  delay before the first run after startup (default 150s — sequenced
#                     after the three existing jobs at 60/90/120s).
#   batch-size        max unsent rows processed per run — bounds async fan-out on a backlog.
#   min-age-ms        a row must be at least this old to be retried, so the job does not
#                     race (and double-send) the normal flow's original async send.
notification.retry.interval-ms=${NOTIFICATION_RETRY_INTERVAL_MS:900000}
notification.retry.initial-delay-ms=${NOTIFICATION_RETRY_INITIAL_DELAY_MS:150000}
notification.retry.batch-size=${NOTIFICATION_RETRY_BATCH_SIZE:100}
notification.retry.min-age-ms=${NOTIFICATION_RETRY_MIN_AGE_MS:120000}

# ─── CORS (P3.3 / BUG-14) ─────────────────────────────────────────────────────
# Browser origins allowed to call the API cross-origin, for a future split
# frontend/backend deployment. Comma-separated, explicit list — NEVER a wildcard.
# Default is the local Vite dev server so local development works out of the box
# (in dev the frontend actually uses the Vite proxy, so CORS is not even exercised).
# Production supplies its real origin(s) via CORS_ALLOWED_ORIGINS, e.g.
#   CORS_ALLOWED_ORIGINS=https://theses.example.edu,https://admin.theses.example.edu
# Auth is a JWT Bearer header (not cookies), so credentials are not enabled cross-origin;
# the Authorization header is explicitly allowed. See SecurityConfig.corsConfigurationSource.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ─── Swagger / SpringDoc ──────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ─── Logging ──────────────────────────────────────────────────────────────────
# Suppress expected Spring Security config warning about UserDetailsService
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# Mail health check follows the same switch: off when email delivery is disabled
# (no SMTP configured), on when mail is enabled so a broken relay surfaces in /health.
management.health.mail.enabled=${MAIL_ENABLED:false}
info.app.name=Diploma Thesis Management System
info.app.version=1.0.0
