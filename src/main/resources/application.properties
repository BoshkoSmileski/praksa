spring.application.name=praksa

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/diploma_system
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Suppress "PostgreSQLDialect does not need to be specified" warning
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Suppress "open-in-view is enabled" warning — we don't use it (we use DTOs)
spring.jpa.open-in-view=false

# ─── File storage ─────────────────────────────────────────────────────────────
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=4a8f3b2e1d9c7f5a3b2e1d9c7f5a4a8f3b2e1d9c7f5a3b2e1d9c7f5a4a8f3b
jwt.expiration-ms=86400000

# ─── External auth integration ────────────────────────────────────────────────
# When false (default): we issue our own JWTs via /api/auth/login.
# When true: tokens must come from an external auth provider that signs with the
# same `jwt.secret`. Unknown but authenticated users are auto-provisioned from
# the token's claims (email, name, role, optional index_number).
# Our own login endpoint stays available either way — handy for development.
auth.external-enabled=false

# ─── Mail ─────────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Swagger / SpringDoc ──────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ─── Logging ──────────────────────────────────────────────────────────────────
# Suppress expected Spring Security config warning about UserDetailsService
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# Exclude mail from health check (placeholder SMTP credentials would always fail)
management.health.mail.enabled=false
info.app.name=Diploma Thesis Management System
info.app.version=1.0.0
